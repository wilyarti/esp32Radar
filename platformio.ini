[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  bitbank2/PNGdec@^1.0.2
  bblanchon/ArduinoJson@^6.21.5

build_flags =
  -D USER_SETUP_LOADED
  -D ILI9341_DRIVER
  ; ILI9341's native panel orientation is portrait (240x320).
  ; setRotation(1/3) then selects landscape (320x240).
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D SPI_FREQUENCY=40000000
